<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WEBGL ADVANCED SHADER BURN v4</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; }
        canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
        .overlay { position:absolute; top:10px; left:10px; color:#0ff; font-family:monospace; pointer-events:none; }
    </style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="overlay">RAYMARCH + FBM + MANDELBROT FEEDBACK • MOUSE = CAMERA</div>

<script>
// === ADVANCED WEBGL SHADER EXPLORER - GPU MELTDOWN ===
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false }) || 
           canvas.getContext('webgl', { alpha: false, antialias: false });

let w, h, time = 0, mouseX = 0, mouseY = 0;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
document.addEventListener('mousemove', e => { mouseX = e.clientX / w; mouseY = e.clientY / h; });

const vsSource = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const fsSource = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform float uTime;
uniform vec2 uRes;
uniform vec2 uMouse;

// === NOISE & FBM AVANCÉ ===
float hash(vec3 p) {
    p = fract(p * 0.3183099 + .1);
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
    vec3 i = floor(x), f = fract(x);
    f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                   mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                   mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
}

float fbm(vec3 p) {
    float v = 0.0, a = 0.5;
    for(int i=0; i<9; i++) {
        v += a * noise(p);
        p *= 2.02; a *= 0.49;
    }
    return v;
}

// === RAYMARCHING SCÈNE ===
float map(vec3 p) {
    float d = length(p) - 1.8 + sin(uTime*0.6 + p.y*3.0)*0.4;
    d = min(d, p.y + 2.5 + fbm(p*1.8 + uTime*0.3)*1.4);
    d = min(d, length(p - vec3(sin(uTime)*3.0, 1.5, cos(uTime*0.7)*3.0)) - 1.2);
    return d;
}

vec3 normal(vec3 p) {
    vec2 e = vec2(0.001, 0.0);
    return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),
                         map(p+e.yxy)-map(p-e.yxy),
                         map(p+e.yyx)-map(p-e.yyx)));
}

vec3 raymarch(vec3 ro, vec3 rd) {
    float t = 0.0;
    for(int i=0; i<120; i++) {
        vec3 p = ro + rd * t;
        float d = map(p);
        if(d < 0.002 || t > 80.0) break;
        t += d * 0.75;
    }
    return vec3(t, 0.0, 0.0);
}

// === MANDELBROT LAYER FEEDBACK ===
float mandel(vec2 c) {
    vec2 z = vec2(0.0);
    for(int i=0; i<80; i++) {
        z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
        if(dot(z,z) > 4.0) return float(i)/80.0;
    }
    return 0.0;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / uRes.y;
    vec3 cam = vec3(sin(uTime*0.2 + uMouse.x*6.0)*6.0, 3.0 + uMouse.y*4.0, cos(uTime*0.2)*8.0);
    vec3 dir = normalize(vec3(uv, -1.0));
    
    vec3 hit = raymarch(cam, dir);
    vec3 col = vec3(0.0);
    
    if(hit.x < 80.0) {
        vec3 p = cam + dir * hit.x;
        vec3 n = normal(p);
        col = n * 0.5 + 0.5;
        col += fbm(p * 3.0 + uTime) * 1.8;
    } else {
        col = vec3(0.02, 0.0, 0.08);
    }
    
    // Overlay Mandel feedback
    vec2 muv = uv * 1.8 + vec2(sin(uTime*0.1)*0.3, cos(uTime*0.13)*0.2);
    float m = mandel(muv * (2.0 + sin(uTime*0.4)*0.8));
    col = mix(col, vec3(m*1.6, m*0.4, sin(m*12.0)), 0.6);
    
    // Post-process heavy
    col = pow(col, vec3(0.85));
    col += noise(vec3(uv*80.0, uTime*12.0)) * 0.15;
    col = fract(col * 1.3 + uTime*0.1);
    
    fragColor = vec4(col, 1.0);
}`;

const program = gl.createProgram();

[gl.VERTEX_SHADER, gl.FRAGMENT_SHADER].forEach((type, i) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, i === 0 ? vsSource : fsSource);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(shader));
    gl.attachShader(program, shader);
});

gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(program));

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(program, "aPos");
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

function render() {
    time += 0.016;
    gl.viewport(0, 0, w, h);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    
    gl.useProgram(program);
    gl.uniform1f(gl.getUniformLocation(program, "uTime"), time);
    gl.uniform2f(gl.getUniformLocation(program, "uRes"), w, h);
    gl.uniform2f(gl.getUniformLocation(program, "uMouse"), mouseX, mouseY);
    
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    
    // Burn supplémentaire
    for(let i=0; i<120000; i++) Math.sin(time * i % 999);
    
    requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
