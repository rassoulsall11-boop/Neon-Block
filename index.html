<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON VORTEX</title>
<!-- ════ CRAZYGAMES SDK v3 ════ -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
:root{
  --cy:#00f3ff;--re:#ff0055;--or:#ff9800;--gr:#00ff88;--pu:#bf00ff;--ye:#ffe600;
  --bg:#020408;--f:'Orbitron',sans-serif;
  --free:#00ff88;--rare:#00b4ff;--epic:#c84bff;--leg:#ffd700;
  --ui-xs:clamp(.48rem,1.4vw,.58rem);
  --ui-sm:clamp(.55rem,1.6vw,.68rem);
  --ui-md:clamp(.68rem,2vw,.85rem);
  --ui-lg:clamp(.85rem,2.4vw,1.1rem);
}
*{box-sizing:border-box;user-select:none;touch-action:none;margin:0;padding:0;}
body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f);}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
/* (Tout ton CSS reste inchangé) */
</style>
</head>
<body>
<!-- Tout ton HTML reste identique jusqu'au canvas -->

<canvas id="canvas"></canvas>

<script>
/* ════ CRAZYGAMES SDK v3 - CORRECTED ════ */
let cgSDKReady = false;

async function initCrazyGamesSDK() {
    if (cgSDKReady) return;
    try {
        if (window.CrazyGames && window.CrazyGames.SDK) {
            console.log("%c[VORTEX] Initialisation CrazyGames SDK v3...", "color:#00ff88");
            await window.CrazyGames.SDK.init();
            cgSDKReady = true;
            console.log("%c[VORTEX] ✅ SDK CrazyGames INITIALISÉ AVEC SUCCÈS", "color:#00ff88; font-weight:bold");
        } else {
            console.warn("%c[VORTEX] ⚠️ SDK non détecté (test local ou adblock)", "color:#ffaa00");
        }
    } catch (e) {
        console.error("%c[VORTEX] ❌ Erreur lors de l'initialisation du SDK", e);
    }
}

async function showCrazyAd(type = 'midgame') {
    if (!cgSDKReady || !window.CrazyGames?.SDK) {
        console.log(`%c[VORTEX] Pub ${type} ignorée (SDK non prêt)`, "color:#ffaa00");
        return false;
    }
    try {
        await window.CrazyGames.SDK.ad.requestAd(type);
        console.log(`%c[VORTEX] ✅ Pub ${type} demandée`, "color:#00ff88");
        return true;
    } catch (e) {
        console.warn(`%c[VORTEX] Pub ${type} refusée`, e);
        return false;
    }
}

/* ====================== TON CODE ORIGINAL (modifié uniquement aux endroits nécessaires) ====================== */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

/* ... Tout le code SKINS, G, AI, CELIA, classes, fonctions ... reste IDENTIQUE ... */

function gameOver(){
  G.state='GAMEOVER';
  document.getElementById('ai-bar').classList.add('hidden');

  // === PUB CRAZYGAMES ===
  showCrazyAd('midgame');

  // Suite du code original
  const earned=Math.floor(G.coinBuffer);
  G.S.coins+=earned;
  G.S.totalCoins+=earned;
  G.coinBuffer=0;

  const deathTax=G.level<=2?Math.floor(G.S.coins*.50):G.level<=5?Math.floor(G.S.coins*.35):G.level<=9?Math.floor(G.S.coins*.20):G.level<=14?Math.floor(G.S.coins*.10):Math.floor(G.S.coins*.04);
  if(deathTax>0){loseCoins(deathTax,canvas.width/2,canvas.height/2);showNotif('💀 TAXE DE MORT : -'+deathTax+'⬡','#ff3333');}

  G.S.kills+=G.kills;
  G.S.best=Math.max(G.S.best,Math.floor(G.score));
  G.S.maxLv=Math.max(G.S.maxLv,G.level);
  G.S.maxCombo=Math.max(G.S.maxCombo,G.maxCombo);
  
  doSave();
  checkAch();
  refreshMenu();
  renderAch();

  document.getElementById('fsc').textContent=Math.floor(G.score);
  document.getElementById('fdt').textContent=`Niveau ${G.level}  •  \( {G.kills} neutralisés  •  Combo × \){G.maxCombo}`;
  const netStr=deathTax>0?` (taxe -${deathTax}⬡)`:'';
  document.getElementById('fcoin').textContent='⬡ +'+earned+' gagnés'+netStr;
  document.getElementById('gov').classList.remove('hidden');
}

/* ====================== INIT MODIFIÉE ====================== */

async function init(){
  await initCrazyGamesSDK();   // ← Initialisation SDK

  resize();
  window.addEventListener('resize', resize);

  const mv = e => {
    if (G.state !== 'PLAYING' && G.state !== 'EV_PAUSE') return;
    const t = e.touches ? e.touches[0] : e;
    G.pl.tx = t.clientX;
    G.pl.ty = t.clientY;
  };

  window.addEventListener('mousemove', mv);
  window.addEventListener('touchmove', mv, {passive:true});
  window.addEventListener('touchstart', mv, {passive:true});
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
  });

  document.getElementById('s1').onclick = () => startGame(1);
  document.getElementById('s2').onclick = () => startGame(Math.max(1, G.S.maxLv));
  document.getElementById('s3').onclick = openShop;
  document.getElementById('s4').onclick = () => {
    renderAch();
    document.getElementById('achpan').classList.remove('hidden');
  };

  document.getElementById('shop-back').onclick = closeShop;
  document.getElementById('achback').onclick = () => document.getElementById('achpan').classList.add('hidden');
  document.getElementById('pbtn').onclick = togglePause;

  initShopTabs();
  loadSave();
  refreshMenu();
  renderAch();

  runLoader(() => showTutoIfNeeded());
  requestAnimationFrame(loop);
}

// Le reste de tes fonctions (resize, refreshMenu, earnCoins, etc.) reste inchangé
// ... (tout le code jusqu'à la fin reste identique)

init();
</script>
</body>
</html>
