<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>STATION APEX - INTERFACE WEB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #004d00; }
        .code-block { background: #151515; border: 1px solid #00FFFF; padding: 10px; border-radius: 5px; margin: 10px 0; display: block; overflow-x: auto; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <header class="border-b border-green-800 pb-4 mb-4">
        <h1 class="text-2xl font-bold tracking-widest">STATION APEX - MODE WEB</h1>
        <div id="status" class="text-xs italic text-green-600">Système : Prêt</div>
    </header>

    <div id="chat-container" class="flex-1 overflow-y-auto custom-scrollbar border border-green-900 p-4 mb-4 bg-black/50">
        </div>

    <div class="flex gap-2">
        <select id="preset" class="bg-black border border-green-700 text-green-500 p-2">
            <option>⚡ Cyber-Expert</option>
            <option>💀 Pentester</option>
            <option>💻 Dev-Master</option>
        </select>
        <input type="text" id="userInput" class="flex-1 bg-black border border-green-700 p-2 outline-none focus:border-green-400" placeholder="Entrer prompt...">
        <button onclick="sendRequest()" class="bg-green-900 hover:bg-green-700 px-6 font-bold">EXECUTE</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');

        async function sendRequest() {
            const message = userInput.value;
            if (!message) return;

            // Ajouter message utilisateur
            chatContainer.innerHTML += `<div class="mb-4"><span class="text-green-400 font-bold">[INGÉNIEUR] ></span> ${message}</div>`;
            userInput.value = '';

            try {
                const response = await fetch('http://localhost:11434/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "mistral",
                        messages: [{ role: "user", content: message }],
                        stream: false
                    })
                });

                const data = await response.json();
                const reply = data.message.content;
                
                // Affichage réponse
                chatContainer.innerHTML += `<div class="mb-4"><span class="text-white font-bold">[ASSISTANT] ></span><br>${reply.replace(/```/g, '<span class="code-block">')}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (e) {
                chatContainer.innerHTML += `<div class="text-red-500">[ERREUR] > Impossible de joindre la station locale.</div>`;
            }
        }
    </script>
</body>
</html>
